version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jira_db
    restart: always
    environment:
      POSTGRES_DB: jiradb
      POSTGRES_USER: jirauser
      POSTGRES_PASSWORD: jira_db_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jira_network

  jira:
    depends_on:
      - db
    image: atlassian/jira-software:9.12
    container_name: jira_app
    restart: always
    ports:
      - "8082:8080"
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://db:5432/jiradb
      - ATL_JDBC_USER=jirauser
      - ATL_JDBC_PASSWORD=jira_db_secure_pass_2026
      - ATL_DB_DRIVER=org.postgresql.Driver
      - ATL_DB_TYPE=postgres72
      - JVM_MINIMUM_MEMORY=1024m
      - JVM_MAXIMUM_MEMORY=2048m
    volumes:
      - jira_home:/var/atlassian/application-data/jira
    networks:
      - jira_network

volumes:
  postgres_data:
    name: jira_db_data
  jira_home:
    name: jira_app_data

networks:
  jira_network:
    name: jira_network
